<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WowEmu — progress</title>
<style>
  :root {
    --void:      #060807;
    --ground:    #0a0e0c;
    --panel:     #0f1512;
    --panel-2:   #131a16;
    --line:      #1e2a22;
    --line-soft: #16201a;

    --ink:   #cfdccc;
    --mute:  #8a9a8c;
    --dim:   #5c6b5e;

    /* Item quality, which is the only palette this project was ever going to use. */
    --poor:      #6d7a6e;
    --common:    #cfdccc;
    --uncommon:  #3ddc6b;
    --rare:      #4a9fe8;
    --epic:      #a862d6;
    --legendary: #e8a33d;
    --danger:    #d4574a;

    --glow: 0 0 18px rgba(61, 220, 107, .18);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #0d1712 0%, transparent 70%),
      var(--void);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--uncommon); text-decoration-color: rgba(61,220,107,.35); text-underline-offset: 3px; }
  a:hover { color: #7bffa0; }

  code, .mono { font-family: var(--mono); }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* ---------------------------------------------------------------- header */

  header {
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(13,23,18,.9), rgba(6,8,7,.6));
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 20;
  }

  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 20px 0 4px; }

  .brand h1 {
    font-family: var(--mono);
    font-size: 26px;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin: 0;
    color: var(--uncommon);
    text-shadow: var(--glow);
  }

  .brand .tagline { color: var(--mute); font-size: 13.5px; }

  .brand .sigil { color: var(--legendary); font-size: 20px; opacity: .85; }

  .headline { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-bottom: 16px; }

  .overall {
    flex: 1 1 260px; min-width: 240px;
    display: flex; align-items: center; gap: 12px;
  }

  .bar {
    flex: 1; height: 8px; border-radius: 99px;
    background: var(--line-soft);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .bar > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, #1f7a41, var(--uncommon));
    box-shadow: 0 0 12px rgba(61,220,107,.5);
    width: 0; transition: width 1.1s cubic-bezier(.2,.8,.2,1);
  }

  .pct { font-family: var(--mono); font-size: 13px; color: var(--uncommon); min-width: 92px; }

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

  .seg button {
    font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
    background: transparent; color: var(--mute); border: 0;
    padding: 7px 13px; cursor: pointer; transition: .15s;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button:hover { color: var(--ink); background: var(--panel-2); }
  .seg button[aria-pressed="true"] { color: var(--void); background: var(--uncommon); font-weight: 600; }

  input[type="search"] {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; flex: 1 1 150px; min-width: 0;
  }
  input[type="search"]:focus { outline: 2px solid rgba(61,220,107,.4); outline-offset: 1px; border-color: var(--uncommon); }

  /* ------------------------------------------------------------ milestones */

  section { padding: 40px 0; }

  h2 {
    font-family: var(--mono); font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 18px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .milestones { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

  .ms {
    border: 1px solid var(--line); border-radius: 12px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    padding: 14px 16px; position: relative; overflow: hidden;
  }
  .ms::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: var(--state);
  }
  .ms .id { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--state); font-weight: 700; }
  .ms .name { font-weight: 600; margin: 2px 0 4px; font-size: 15px; }
  .ms .meaning { color: var(--mute); font-size: 12.5px; line-height: 1.5; }
  .ms .note { color: var(--dim); font-size: 11.5px; margin-top: 8px; line-height: 1.5; }

  .ms[data-state="done"]     { --state: var(--uncommon); }
  .ms[data-state="progress"] { --state: var(--rare); }
  .ms[data-state="todo"]     { --state: var(--poor); }

  /* ---------------------------------------------------------------- phases */

  .phase {
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel); margin-bottom: 12px; overflow: hidden;
  }

  .phase > summary {
    list-style: none; cursor: pointer;
    padding: 15px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    transition: background .15s;
  }
  .phase > summary::-webkit-details-marker { display: none; }
  .phase > summary:hover { background: var(--panel-2); }
  .phase > summary:focus-visible { outline: 2px solid var(--uncommon); outline-offset: -2px; }

  .chev { color: var(--dim); font-family: var(--mono); font-size: 11px; transition: transform .2s; }
  .phase[open] .chev { transform: rotate(90deg); }

  .phase .num {
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    color: var(--dim); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 8px; min-width: 44px; text-align: center;
  }

  .phase .title { font-weight: 600; font-size: 15.5px; flex: 1 1 auto; min-width: 0; }

  .badge {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 99px; border: 1px solid;
  }
  .badge.done     { color: var(--uncommon);  border-color: rgba(61,220,107,.35);  background: rgba(61,220,107,.08); }
  .badge.progress { color: var(--rare);      border-color: rgba(74,159,232,.35);  background: rgba(74,159,232,.08); }
  .badge.todo     { color: var(--poor);      border-color: var(--line); }
  .badge.ms       { color: var(--legendary); border-color: rgba(232,163,61,.4);   background: rgba(232,163,61,.08); }

  /* Shrinkable rather than fixed: on a narrow screen a 120px floor pushes the row past the
     viewport, and the whole page then scrolls sideways. */
  .mini { display: flex; align-items: center; gap: 8px; flex: 1 1 110px; min-width: 0; max-width: 160px; }
  .mini .bar { height: 5px; }
  .mini .n { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }

  .phase-body { padding: 4px 18px 18px; border-top: 1px solid var(--line-soft); }
  .summary-line { color: var(--mute); font-size: 13.5px; margin: 14px 0 18px; }

  .group + .group { margin-top: 22px; }
  .group h3, section h3 {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--mute); margin: 0 0 10px; font-weight: 600;
  }
  section h3 { margin-top: 24px; }
  .group h3::before, section h3::before { content: "▸ "; color: var(--dim); }

  ul.items { list-style: none; margin: 0; padding: 0; }

  li.item {
    display: grid; grid-template-columns: 22px 1fr; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--line-soft);
  }
  li.item:last-child { border-bottom: 0; }

  li.item .mark { font-family: var(--mono); font-size: 13px; line-height: 1.6; }
  li.item[data-done="true"]  .mark { color: var(--uncommon); }
  li.item[data-done="false"] .mark { color: var(--dim); }
  li.item[data-blocked="true"] .mark { color: var(--legendary); }

  li.item .text { font-size: 14px; }
  li.item[data-done="true"] .text { color: var(--mute); }
  li.item[data-blocked="true"] .text { color: var(--legendary); font-weight: 600; }

  li.item .note {
    display: block; color: var(--dim); font-size: 12.5px; line-height: 1.55; margin-top: 3px;
    border-left: 2px solid var(--line); padding-left: 10px;
  }

  /* Things worth shouting about are written in caps in the data; render them as such. */
  li.item .text b { color: var(--ink); font-weight: 700; }
  li.item[data-done="true"] .text b { color: var(--common); }

  /* ------------------------------------------------------------------ gaps */

  .gap { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 10px; }
  .gap > summary {
    list-style: none; cursor: pointer; padding: 13px 18px;
    display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14.5px;
  }
  .gap > summary::-webkit-details-marker { display: none; }
  .gap > summary:hover { background: var(--panel-2); }
  .gap .count { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: auto; }
  .gap ul { margin: 0; padding: 0 18px 16px 44px; }
  .gap li { color: var(--mute); font-size: 13.5px; padding: 5px 0; }
  .gap li::marker { color: var(--danger); }

  /* ------------------------------------------------------------- reference */

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }

  .card {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    padding: 16px 18px;
  }
  .card h4 { margin: 0 0 6px; font-size: 14.5px; }
  .card p { margin: 0 0 10px; color: var(--mute); font-size: 12.5px; line-height: 1.55; }

  pre {
    margin: 0; background: var(--void); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto;
    font-family: var(--mono); font-size: 12px; color: var(--uncommon); line-height: 1.7;
  }

  .scroller { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  th { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  td.path { font-family: var(--mono); color: var(--uncommon); white-space: nowrap; font-size: 12px; }
  td.what { color: var(--mute); }

  .prose li { color: var(--mute); font-size: 13.5px; padding: 4px 0; }
  .prose ul { padding-left: 20px; }
  .prose li::marker { color: var(--dim); }

  footer {
    border-top: 1px solid var(--line); margin-top: 40px; padding: 26px 0 60px;
    color: var(--dim); font-size: 12.5px;
  }

  .hint {
    border: 1px solid rgba(232,163,61,.35); background: rgba(232,163,61,.07);
    border-radius: 12px; padding: 18px 20px; color: var(--ink);
  }
  .hint h3 { margin: 0 0 8px; color: var(--legendary); font-size: 15px; }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <span class="sigil">❖</span>
      <h1 id="brand-name">WowEmu</h1>
      <span class="tagline" id="brand-tagline"></span>
    </div>
    <div class="headline">
      <div class="overall">
        <span class="pct" id="overall-pct">— / —</span>
        <span class="bar"><i id="overall-bar"></i></span>
      </div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Filter items">
          <button data-filter="all" aria-pressed="true">All</button>
          <button data-filter="open" aria-pressed="false">Remaining</button>
          <button data-filter="done" aria-pressed="false">Done</button>
        </div>
        <input type="search" id="search" placeholder="search…" aria-label="Search items">
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <p id="loading" style="padding:60px 0;color:var(--mute)">Reading <code>todo.json</code>…</p>
</main>

<footer class="wrap">
  <p id="legal"></p>
  <p>Generated from <code>web/todo.json</code> — edit that file and this page follows.</p>
</footer>

<script>
const STATE_GLYPH = { done: "✔", progress: "◆", todo: "○" };
const ITEM_GLYPH  = { done: "✔", open: "·", blocked: "▲" };

/* Words written in ALL CAPS in the data are the ones worth shouting about; wrap them so the
   stylesheet can lift them out without the JSON carrying any markup. */
function emphasise(text) {
  const escaped = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // Apostrophes stay inside the run, so AZEROTHCORE'S does not split a phrase in half, and a short
  // word may anchor one, so THE TWO REFERENCE TREES... starts where it reads. The length floor is
  // what stops every DBC and PLAN in the text from shouting.
  //
  // Not preceded by a path or word character, so data/README.md is left alone, and not followed by
  // a lowercase file extension, so README.md is too. Sentence-ending punctuation is fine.
  return escaped.replace(
    /(?<![\w\/])([A-Z][A-Z0-9_'’]{2,}(?:\s+[A-Z][A-Z0-9_'’]*)*)(?![\w\/]|\.[a-z])/g,
    (m) => (m.length >= 6 ? `<b>${m}</b>` : m));
}

function el(tag, cls, html) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html !== undefined) node.innerHTML = html;
  return node;
}

function progressBar(done, total, extraClass) {
  const wrap = el("div", "mini" + (extraClass ? " " + extraClass : ""));
  const bar = el("span", "bar");
  const fill = el("i");
  fill.dataset.pct = total ? Math.round((done / total) * 100) : 0;
  bar.append(fill);
  wrap.append(bar, el("span", "n", `${done}/${total}`));
  return wrap;
}

function renderItem(item) {
  const li = el("li", "item");
  li.dataset.done = String(!!item.done);
  if (item.blocked) li.dataset.blocked = "true";

  const glyph = item.blocked ? ITEM_GLYPH.blocked : item.done ? ITEM_GLYPH.done : ITEM_GLYPH.open;
  li.append(el("span", "mark", glyph));

  const body = el("div");
  body.append(el("span", "text", emphasise(item.text)));
  if (item.note) body.append(el("span", "note", emphasise(item.note)));
  li.append(body);

  li.dataset.haystack = (item.text + " " + (item.note || "")).toLowerCase();
  return li;
}

function renderPhase(phase) {
  const items = phase.groups.flatMap((g) => g.items);
  const done = items.filter((i) => i.done).length;

  const details = el("details", "phase");
  details.open = phase.state === "progress";

  const summary = el("summary");
  summary.append(el("span", "chev", "▶"));
  summary.append(el("span", "num", typeof phase.id === "number" ? `PH ${phase.id}` : phase.id));
  summary.append(el("span", "title", phase.title));
  if (phase.milestone) summary.append(el("span", "badge ms", phase.milestone));
  summary.append(el("span", `badge ${phase.state}`, `${STATE_GLYPH[phase.state]} ${phase.state}`));
  summary.append(progressBar(done, items.length));
  details.append(summary);

  const body = el("div", "phase-body");
  if (phase.summary) body.append(el("p", "summary-line", emphasise(phase.summary)));

  for (const group of phase.groups) {
    const section = el("div", "group");
    section.append(el("h3", null, group.title));
    const ul = el("ul", "items");
    group.items.forEach((item) => ul.append(renderItem(item)));
    section.append(ul);
    body.append(section);
  }

  details.append(body);
  return details;
}

function scrollable(node) {
  const wrap = el("div", "scroller");
  wrap.append(node);
  return wrap;
}

function section(title, node) {
  const s = el("section");
  s.append(el("h2", null, title));
  s.append(node);
  return s;
}

function render(data) {
  document.title = `${data.project.name} — progress`;
  document.getElementById("brand-name").textContent = data.project.name;
  document.getElementById("brand-tagline").textContent = data.project.tagline;
  document.getElementById("legal").textContent = data.legal;

  const main = document.getElementById("main");
  main.textContent = "";

  // ---- intro
  const intro = el("section");
  intro.append(el("p", null,
    `<span style="color:var(--mute)">${data.project.target}</span><br>
     <span style="color:var(--dim);font-size:13px">${data.project.note}</span>`));
  main.append(intro);

  // ---- milestones
  const strip = el("div", "milestones");
  for (const m of data.milestones) {
    const card = el("div", "ms");
    card.dataset.state = m.state;
    card.append(el("div", "id", `${STATE_GLYPH[m.state]} ${m.id}`));
    card.append(el("div", "name", m.name));
    card.append(el("div", "meaning", m.meaning));
    if (m.note) card.append(el("div", "note", m.note));
    strip.append(card);
  }
  main.append(section("◆ Milestones", strip));

  // ---- phases
  const phases = el("div");
  data.phases.forEach((p) => phases.append(renderPhase(p)));
  main.append(section("❖ Phases", phases));

  // ---- overall progress
  const allItems = data.phases.flatMap((p) => p.groups.flatMap((g) => g.items));
  const doneCount = allItems.filter((i) => i.done).length;
  const pct = Math.round((doneCount / allItems.length) * 100);

  document.getElementById("overall-pct").textContent = `${doneCount}/${allItems.length} · ${pct}%`;
  requestAnimationFrame(() => { document.getElementById("overall-bar").style.width = pct + "%"; });

  // ---- gaps
  const gaps = el("div");
  for (const g of data.gaps) {
    const d = el("details", "gap");
    const s = el("summary");
    s.append(el("span", null, `† ${g.category}`));
    s.append(el("span", "count", `${g.items.length}`));
    d.append(s);
    const ul = el("ul");
    g.items.forEach((t) => ul.append(el("li", null, emphasise(t))));
    d.append(ul);
    gaps.append(d);
  }
  const gapIntro = el("p", "summary-line",
    "Things that currently work by returning nothing, zero, or a constant. Each is invisible in normal play, which is exactly why they are written down.");
  const gapWrap = el("div");
  gapWrap.append(gapIntro, gaps);
  main.append(section("† Stubs and silent gaps", gapWrap));

  // ---- worth remembering
  const remember = el("div", "prose");
  const rl = el("ul");
  data.remember.forEach((t) => rl.append(el("li", null, emphasise(t))));
  remember.append(rl);
  main.append(section("✦ Worth remembering", remember));

  // ---- quickstart
  const cards = el("div", "cards");
  for (const q of data.quickstart) {
    const c = el("div", "card");
    c.append(el("h4", null, q.title));
    if (q.note) c.append(el("p", null, q.note));
    c.append(el("pre", null, q.commands.map((x) =>
      x.replace(/&/g, "&amp;").replace(/</g, "&lt;")).join("\n")));
    cards.append(c);
  }
  main.append(section("▸ Quickstart", cards));

  // ---- databases
  const dbTable = el("table");
  dbTable.innerHTML =
    "<thead><tr><th>Database</th><th>Schema from</th><th>Data from</th></tr></thead><tbody>" +
    data.databases.map((d) =>
      `<tr><td class="path">${d.name}</td><td class="what">${d.schema}</td><td class="what">${d.data}</td></tr>`).join("") +
    "</tbody>";
  main.append(section("▤ Where each database comes from", scrollable(dbTable)));

  // ---- layout
  const layoutTable = el("table");
  layoutTable.innerHTML = "<tbody>" + data.layout.map((l) =>
    `<tr><td class="path">${l.path}</td><td class="what">${l.what}</td></tr>`).join("") + "</tbody>";
  main.append(section("▦ Layout", scrollable(layoutTable)));

  // ---- vectors
  const vec = el("div");
  vec.append(el("p", "summary-line", data.vectors.note));
  const vt = el("table");
  vt.innerHTML =
    "<thead><tr><th>File</th><th>Generated by</th><th>Covers</th></tr></thead><tbody>" +
    data.vectors.sets.map((v) =>
      `<tr><td class="path">${v.file}</td><td class="what">${v.by}</td><td class="what">${v.covers}</td></tr>`).join("") +
    "</tbody>";
  vec.append(scrollable(vt));
  const why = el("div", "prose");
  const wl = el("ul");
  data.vectors.why.forEach((t) => wl.append(el("li", null, emphasise(t))));
  why.append(wl);
  vec.append(why);
  main.append(section("✧ On the test vectors", vec));

  // ---- vscode tasks
  if (data.vscode) {
    const vs = el("div");
    vs.append(el("p", "summary-line", data.vscode.note));
    const vt = el("table");
    vt.innerHTML = "<thead><tr><th>Task</th><th>What it does</th></tr></thead><tbody>" +
      data.vscode.tasks.map((t) =>
        `<tr><td class="path">${t.label}</td><td class="what">${t.what}</td></tr>`).join("") +
      "</tbody>";
    vs.append(scrollable(vt));

    if (data.vscode.launch) {
      vs.append(el("h3", null, "Run and Debug (⇧⌘D)"));
      const lt = el("table");
      lt.innerHTML = "<tbody>" + data.vscode.launch.map((l) =>
        `<tr><td class="path">${l.label}</td><td class="what">${l.what}</td></tr>`).join("") + "</tbody>";
      vs.append(scrollable(lt));
    }

    main.append(section("▶ VS Code", vs));
  }

  // ---- conventions
  const conv = el("div", "prose");
  const cl = el("ul");
  data.conventions.forEach((t) => cl.append(el("li", null, emphasise(t))));
  conv.append(cl);
  main.append(section("‡ Conventions", conv));

  // Fill the per-phase bars after layout, so the transition is visible.
  requestAnimationFrame(() => {
    document.querySelectorAll(".mini .bar > i").forEach((i) => { i.style.width = i.dataset.pct + "%"; });
  });

  wireControls();
}

function wireControls() {
  const buttons = [...document.querySelectorAll(".seg button")];
  const search = document.getElementById("search");
  let filter = "all";

  function apply() {
    const needle = search.value.trim().toLowerCase();

    for (const li of document.querySelectorAll("li.item")) {
      const isDone = li.dataset.done === "true";
      const passesFilter = filter === "all" || (filter === "done") === isDone;
      const passesSearch = !needle || li.dataset.haystack.includes(needle);

      li.classList.toggle("hidden", !(passesFilter && passesSearch));
    }

    // A group or phase with nothing left to show is noise, so it goes too.
    for (const group of document.querySelectorAll(".group")) {
      const visible = group.querySelectorAll("li.item:not(.hidden)").length;
      group.classList.toggle("hidden", visible === 0);
    }

    for (const phase of document.querySelectorAll(".phase")) {
      const visible = phase.querySelectorAll("li.item:not(.hidden)").length;
      phase.classList.toggle("hidden", visible === 0);

      // Searching is a request to see the matches, not to go hunting for them.
      if (visible > 0 && (needle || filter !== "all")) phase.open = true;
    }
  }

  buttons.forEach((b) => b.addEventListener("click", () => {
    filter = b.dataset.filter;
    buttons.forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    apply();
  }));

  search.addEventListener("input", apply);
}

fetch("todo.json")
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => {
    // Opening this straight off disk gives file:// , where fetch of a sibling file is blocked.
    // Say so plainly rather than showing an empty page.
    document.getElementById("main").innerHTML = `
      <div class="hint" style="margin-top:40px">
        <h3>▲ Could not read todo.json</h3>
        <p style="color:var(--mute)">Browsers block <code>fetch</code> of a local file when the page is
        opened directly from disk. Serve the folder instead:</p>
        <pre>cd web &amp;&amp; python3 -m http.server 8000
# then open http://localhost:8000</pre>
      </div>`;
  });
</script>
</body>
