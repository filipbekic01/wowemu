# Build, test and vector verification — PLAN.md §11.1, the last unticked item of Phase 0.
#
# ─────────────────────────────────────────────────────────────────────────────
# CURRENTLY DISABLED. Nothing runs automatically; the runner minutes were not
# earning their cost while the work is all local.
#
# To re-enable, uncomment the `push:` and `pull_request:` triggers below. The
# jobs themselves are untouched and still correct.
#
# Until then it can still be run by hand from the Actions tab (workflow_dispatch),
# which costs nothing unless you ask for it.
# ─────────────────────────────────────────────────────────────────────────────
#
# Two jobs, split by what they need:
#
#   build-test   the SDK and nothing else. Fast, runs on every push, and is the gate that matters.
#   integration  a MySQL service container, the vendored world content, and the logon gate driven
#                over a real socket.
#
# What CI deliberately does NOT cover: anything that reads data/. The .dbc, .map, .vmap and .mmap
# files are extracted from a retail client and are never committed (see README "Legal"), so the
# world server cannot boot here. Those gates stay local — tools/harness/m2_world.py and friends.
name: CI

on:
  # Re-enable by uncommenting these two.
  # push:
  #   branches: ["**"]
  # pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is on in Directory.Build.props, so a new analyzer warning fails here.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The whole solution, which includes WowEmu.Tests.Integration — with no MySQL and no
      # WOWEMU_INTEGRATION those skip themselves, which also keeps the skip path honest. They run
      # for real in the job below.
      - name: Unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      # The vectors are generated by something other than our own C# — an independent Python
      # transcription, and AzerothCore's own SFMT compiled in a container. This checks that every
      # generated value is still present in the tests, so a vector cannot be quietly edited to match
      # a regression.
      - name: Vectors still match the tests
        run: python3 tools/vectors/verify_vectors_in_tests.py

  integration:
    name: Integration (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wowemu
          MYSQL_DATABASE: wowemu_auth
          MYSQL_USER: wowemu
          MYSQL_PASSWORD: wowemu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwowemu"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # The service container is reachable over TCP but not by `docker exec`, so the import script
      # has to take its client path.
      WOWEMU_MYSQL_MODE: client
      WOWEMU_MYSQL_HOST: 127.0.0.1
      WOWEMU_MYSQL_PORT: "3306"
      WOWEMU_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The runner image is not guaranteed to carry a MySQL client, and the import script needs one
      # to reach a service container it cannot `docker exec` into.
      - name: Ensure a mysql client is present
        run: command -v mysql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client)

      # The collation matters: usernames are compared case-sensitively after normalization, and
      # docker/mysql-init only runs on a fresh volume, which a service container does not have.
      - name: Create the characters schema
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -pwowemu -e "
            CREATE DATABASE IF NOT EXISTS wowemu_characters
              CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
            GRANT ALL PRIVILEGES ON wowemu_characters.* TO 'wowemu'@'%';
            FLUSH PRIVILEGES;"

      - name: Import world content
        run: tools/db/import-world.sh

      - name: Integration tests
        run: dotnet test tests/WowEmu.Tests.Integration --configuration Release --verbosity normal
